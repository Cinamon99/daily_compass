name: 构建 Windows 版

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable

      - name: 安装依赖
        run: flutter pub get

      - name: 构建 Release
        run: flutter build windows --release

      - name: 打包成 zip
        shell: pwsh
        run: |
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "daily_compass_windows.zip"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: daily-compass-windows
          path: daily_compass_windows.zip

      - name: 发布到 Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: daily_compass_windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
